name: Publicera klassens helvecksvy till testlänken
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-class-week-preview.yml
      - src/App.css
      - src/App.jsx
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://siirwdmgbxwycndrxduu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_rxWH5Fp9KCEQ0madyKmjWw_uhIG5SiM
      - name: Publicera till befintliga fix-planering-testlänken
        run: |
          CLOUDFLARE_API_TOKEN="$(node -e '
            const raw=process.env.CLOUDFLARE_API_TOKEN||"";
            const bearer=raw.match(/Bearer\s+([A-Za-z0-9_-]{30,})/i);
            const candidates=raw.match(/[A-Za-z0-9_-]{35,}/g)||[];
            const token=bearer?.[1] || candidates.find(v=>v.length>=35 && v.length<=100);
            if(!token){process.stderr.write("Cloudflare-token saknas eller är ogiltig.\n");process.exit(1)}
            process.stdout.write(token);
          ')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 preview --name "fix/planering" --message "Klass: hel vecka med alla lektioner som originalets miniatyr"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1117b3ec07a0dd6de08ca8ccb477f269

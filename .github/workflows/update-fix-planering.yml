name: Uppdatera fix-planering testlänk
# Visa hela klassveckan och rensa ikonernas bakgrund i testversionen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-fix-planering.yml
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: Uppdatera versionen som visas på fix-planering länken
        run: |
          # Tolka nyckeln även om användaren kopierat hela Bearer-raden från mobilen.
          CLOUDFLARE_API_TOKEN="$(node -e '
            const raw=process.env.CLOUDFLARE_API_TOKEN||"";
            const bearer=raw.match(/Bearer\s+([A-Za-z0-9_-]{30,})/i);
            const candidates=raw.match(/[A-Za-z0-9_-]{35,}/g)||[];
            const token=bearer?.[1] || candidates.find(v=>v.length>=35 && v.length<=100);
            if(!token){process.stderr.write("Cloudflare-nyckeln i GitHub har fel format.\n");process.exit(1)}
            process.stdout.write(token);
          ')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 versions upload --preview-alias fix-planering
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1117b3ec07a0dd6de08ca8ccb477f269

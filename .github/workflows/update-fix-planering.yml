name: Återställ fix-planering till tidigare fungerande version
# ÅTERSTÄLLNING: exakt samma gränssnitt som preview 111 före felsökningen, med giltig Supabase-nyckel.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-fix-planering.yml
      - src/**
      - wrangler.jsonc
      - vite.config.js
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f85d912120d7b8b1ae26ae9a175390d00e917eae
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Historisk version återställs utan att dagens regler för navigation tillämpas.
      - name: Bygg historisk version med aktuell giltig Supabase publishable key
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://siirwdmgbxwycndrxduu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_rxWH5Fp9KCEQ0madyKmjWw_uhIG5SiM
      - name: Uppdatera versionen som visas på fix-planering länken
        run: |
          # Tolka nyckeln även om användaren kopierat hela Bearer-raden från mobilen.
          CLOUDFLARE_API_TOKEN="$(node -e '
            const raw=process.env.CLOUDFLARE_API_TOKEN||"";
            const bearer=raw.match(/Bearer\s+([A-Za-z0-9_-]{30,})/i);
            const candidates=raw.match(/[A-Za-z0-9_-]{35,}/g)||[];
            const token=bearer?.[1] || candidates.find(v=>v.length>=35 && v.length<=100);
            if(!token){process.stderr.write("Cloudflare-nyckeln i GitHub har fel format.\n");process.exit(1)}
            process.stdout.write(token);
          ')"
          export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 preview --name "fix/planering" --message "Återställ ursprungliga versionen före chatten"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1117b3ec07a0dd6de08ca8ccb477f269

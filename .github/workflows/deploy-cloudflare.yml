name: Publicera årsplanering till Cloudflare
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Skriv exakt PUBLICERA för att bekräfta publicering till produktion'
        required: true
        type: string
jobs:
  deploy:
    # Tre spärrar: körs bara från main, kräver repo-variabeln ALLOW_PRODUCTION_DEPLOY="true",
    # och kräver att bekräftelsetexten är exakt PUBLICERA.
    if: github.ref == 'refs/heads/main' && vars.ALLOW_PRODUCTION_DEPLOY == 'true' && inputs.confirm == 'PUBLICERA'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: Publicera webbplatsens statiska filer
        run: npx --yes wrangler@4 pages deploy dist --project-name=minplanering --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1117b3ec07a0dd6de08ca8ccb477f269

name: Kontrollera årsplanering
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/arsplanering-safe-updates-20261013
      - test/arsplanering-build-20261027
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://tdbmhkwsgzflqgmftzyy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_q42eqoSAfkeQf3A0ks_XlQ_WkouV40K
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

      - name: Verify isolated Supabase bundle
        run: |
          grep -rl 'tdbmhkwsgzflqgmftzyy.supabase.co' dist/assets/ >/dev/null
          if grep -rl 'siirwdmgbxwycndrxduu.supabase.co' dist/assets/ >/dev/null; then
            echo 'ERROR: Production Supabase URL found in test bundle' >&2
            exit 1
          fi

      - name: Save built website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arsplanering-dist
          path: dist/

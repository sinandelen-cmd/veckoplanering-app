name: Isolerad Chromium-kontroll
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated Playwright runner (no lockfile change)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated Vite fixture
        run: |
          npm run dev -- --host 127.0.0.1 --port 4175 > /tmp/veckoplanering-browser.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4175/tests/browser-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/veckoplanering-browser.log
          exit 1
      - name: Run real Chromium interactions against fixture only
        run: node tests/browser-integration-check.mjs

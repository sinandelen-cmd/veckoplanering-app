name: Isolerad Supabase fullstack (Auth PostgREST RLS RPC)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: isolated-supabase-${{ github.event.pull_request.number || github.ref }}
  # Preserve a running Docker image download when a newer commit arrives.
  # New runs queue instead of repeatedly cancelling fullstack verification.
  cancel-in-progress: false
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Discover pinned Supabase CLI commands
        run: |
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 init --help
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 start --help
      - name: Create isolated local Supabase project and fixture migration
        run: |
          # Existing production migrations are NOT suitable for this minimal fixture.
          # Move them aside ONLY inside this disposable checkout.
          if [ -d supabase ]; then mv supabase /tmp/isolated-original-supabase-migrations; fi
          npx --yes supabase@2.81.3 init --force
          npx --yes supabase@2.81.3 migration new isolated_fullstack_fixture
          cp tests/sql/local-supabase-fullstack-fixture.sql "$(find supabase/migrations -type f -name '*isolated_fullstack_fixture.sql' | head -1)"
          test -s "$(find supabase/migrations -type f -name '*isolated_fullstack_fixture.sql' | head -1)"
      - name: Pre-pull isolated Supabase images from Docker Hub mirror
        timeout-minutes: 8
        run: |
          # The public ECR registry sometimes rejects anonymous CI pulls with
          # "toomanyrequests: Data limit exceeded". Pull equivalent tagged
          # Supabase images from Docker Hub and retag them for local CLI use.
          # A failed mirror pull does not conceal a later Supabase startup error.
          images=(
            "postgres:17.6.1.095"
          )
          for image in "${images[@]}"; do
            name="${image%%:*}"
            tag="${image#*:}"
            if timeout 180s docker pull "supabase/${name}:${tag}"; then
              docker tag "supabase/${name}:${tag}" "public.ecr.aws/supabase/${name}:${tag}"
            else
              echo "::warning title=Image mirror unavailable::Could not prefetch ${image}; normal Supabase startup will retry ECR."
            fi
          done
      - name: Start disposable Docker Supabase fullstack (never linked to production)
        timeout-minutes: 10
        run: |
          # Bound startup and report the actual Docker failure instead of waiting
          # through another multi-minute registry retry.
          set -o pipefail
          log_file="$(mktemp)"
          echo "Starting isolated Supabase (hard limit: 8 minutes)"
          if timeout --signal=TERM --kill-after=15s 8m npx --yes supabase@2.81.3 start --exclude realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor,mailpit 2>&1 | tee "$log_file"; then
            rm -f "$log_file"
            exit 0
          fi
          if grep -Eiq 'toomanyrequests|Data limit exceeded|rate.?limit|pull rate limit|429 Too Many Requests' "$log_file"; then
            echo "::error title=External Docker registry quota::Image download was blocked by the public registry. No application tests were run."
          else
            echo "::error title=Isolated Supabase startup failed::See the startup output above for the Docker/Supabase error."
          fi
          echo "Docker containers after failed startup:"
          timeout 10s docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          rm -f "$log_file"
          exit 1
      - name: Capture local-only API endpoint and ephemeral anon key
        run: |
          npx --yes supabase@2.81.3 status -o env > /tmp/isolated-supabase-status.env
          API_URL="$(sed -n 's/^API_URL=//p' /tmp/isolated-supabase-status.env | tr -d '"')"
          ANON_KEY="$(sed -n 's/^ANON_KEY=//p' /tmp/isolated-supabase-status.env | tr -d '"')"
          test -n "$API_URL" && test -n "$ANON_KEY"
          case "$API_URL" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "Unsafe external API URL" >&2; exit 1 ;; esac
          echo "ISOLATED_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ISOLATED_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$ANON_KEY"
      - name: Real GoTrue Auth, PostgREST, owner RLS and public RPC contract
        run: node tests/local-supabase-fullstack-check.mjs
      - name: Install browser test runner and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start real App.jsx against disposable local Supabase
        run: |
          VITE_SUPABASE_URL="$ISOLATED_SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$ISOLATED_SUPABASE_ANON_KEY" npm run dev -- --host 127.0.0.1 --port 4177 > /tmp/isolated-fullstack-app.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/isolated-fullstack-app.log
          exit 1
      - name: Real Chromium teacher login and public student RPC end-to-end
        run: node tests/browser-local-supabase-fullstack-check.mjs
      - name: Stop isolated Supabase stack
        if: always()
        run: timeout --signal=TERM --kill-after=10s 45s npx --yes supabase@2.81.3 stop --no-backup || true

<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Årsplanering – responsiv kontroll</title><style>body{margin:0;font:15px system-ui;background:#e9eeee;color:#183c35}header{padding:12px;background:white;position:sticky;top:0;z-index:2}button{padding:10px;margin:4px;cursor:pointer}iframe{display:block;border:1px solid #879e95;background:white;height:820px;margin:16px auto;max-width:100%}p{margin:4px}</style><header><strong>Responsiv kontroll – endast syntetiska data</strong><p>Kontrollerar CSS-bredd i Chrome. Detta emulerar inte iOS eller pekskärm.</p><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><output id="size">390 px</output></header><iframe title="Årsplanering testdata" src="/qa/" style="width:390px"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.getElementById('size').textContent=b.dataset.width+' px'})</script></html>

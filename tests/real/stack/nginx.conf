events {}
http {
  client_max_body_size 60m;
  map $http_origin $cors_origin { default $http_origin; }
  server {
    listen 8000;
    # Liknar Kong i Supabase: CORS för webbläsare, och OPTIONS-förfrågningar besvaras direkt.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD" always;
    add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,prefer,range,accept-profile,content-profile,x-upsert,x-supabase-api-version,cache-control" always;
    add_header Access-Control-Expose-Headers "content-range,range" always;
    location /auth/v1/ { if ($request_method = OPTIONS) { return 204; } proxy_pass http://auth:9999/; proxy_set_header Host $host; }
    location /rest/v1/ { if ($request_method = OPTIONS) { return 204; } proxy_pass http://rest:3000/; proxy_set_header Host $host; proxy_set_header Accept-Profile $http_accept_profile; proxy_set_header Content-Profile $http_content_profile; }
    location /storage/v1/ { if ($request_method = OPTIONS) { return 204; } proxy_pass http://storage:5000/; proxy_set_header Host $host; }
  }
}
